<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geburtstagskarte zum 63. für Papa 🎂</title>
    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #000000 100%);
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: rgb(232, 0, 0);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.313);
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #000000;
            margin-bottom: 5px;
        }
        .cake-img {
            width: 100%;
            max-width: 500px;
            height: auto;
            margin: 15px 0;
            border-radius: 12px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 2px solid #000000;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 10px;
        }
        button {
            background-color: #000000;
            color: rgba(255, 0, 0, 0.735);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #74b9ff;
        }
        .wishes-container {
            margin-top: 20px;
            text-align: left;
            max-height: 220px;
            overflow-y: auto;
            border-top: 2px solid #f1f1f1;
            padding-top: 15px;
        }
        .wish-item {
            background: #dfe6e9;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: #ff7675;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background: #d63031;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Alles Gute zum Geburtstag, Papa! 🎂</h1>
        <p>Trage hier deine Wünsche ein, damit er sie sehen kann!</p>
        
        <!-- Torten-Bild -->
        <img src="assets/pics/birthdaycake/birthdaycake.jpg" alt="Geburtstagstorte" class="cake-img">

        <h2>Der Countdown läuft!!!, Nur noch 4 Jahre bis zur Wohlverdienten Rente... Alles, alles gute zum Geburtstag!!!, lass dich feiern und bleib Gesund!!!</h2>

        <div>
            <textarea id="wishInput" placeholder="Dein Glückwunsch für Papa..."></textarea>
            <br>
            <button id="sendBtn">Glückwunsch abschicken</button>
        </div>

        <div class="wishes-container">
            <h3>Alle Glückwünsche:</h3>
            <div id="wishesContent">Lade Wünsche...</div>
        </div>
    </div>

    <!-- JavaScript-Brücke mit Cache-Buster -->
   <!-- Zuverlässige JavaScript-Brücke -->
    <script>
        const BIN_ID = "6aa640e9ffd5d16053008348";
        const API_KEY = "$2a$10$.s1t/9O62oQZZnpvpjzIhu81NrRa5Kn8kMoJFTMgj2dnBTPS.54da";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

        async function apiGetWishes() {
            try {
                const res = await fetch(`${API_URL}?t=${new Date().getTime()}`, {
                    headers: { "X-Master-Key": API_KEY }
                });
                const json = await res.json();
                let wishes = json.record?.wishes || json.wishes || [];
                // Konvertiere absolut sicher in ein reines JS-Array von Strings/Objekten
                return Array.isArray(wishes) ? wishes : [];
            } catch (err) {
                console.error("Fehler beim Laden:", err);
                return [];
            }
        }

        async function apiSaveWish(newText) {
            const res = await fetch(API_URL, {
                headers: { "X-Master-Key": API_KEY }
            });
            const json = await res.json();
            let wishes = json.record?.wishes || json.wishes || [];
            if (!Array.isArray(wishes)) wishes = [];
            
            wishes.unshift({ text: newText });

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": API_KEY
                },
                body: JSON.stringify({ wishes: wishes })
            });
            return true;
        }

        async function apiDeleteWish(index) {
            const res = await fetch(API_URL, {
                headers: { "X-Master-Key": API_KEY }
            });
            const json = await res.json();
            let wishes = json.record?.wishes || json.wishes || [];
            
            if (Array.isArray(wishes) && wishes[index] !== undefined) {
                wishes.splice(index, 1);

                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": API_KEY
                    },
                    body: JSON.stringify({ wishes: wishes })
                });
                return true;
            }
            return false;
        }
    </script>

    <!-- Saubere Python-Logik -->
    <script type="py">
from pyscript import document
import js
import asyncio

async def load_wishes():
    container = document.getElementById("wishesContent")
    if not container:
        return
    try:
        # JS-Funktion liefert ein sauberes Array
        js_wishes = await js.apiGetWishes()
        container.innerHTML = ""
        
        # In Python-Liste umwandeln
        wishes_list = [item for item in js_wishes]
        
        if not wishes_list:
            container.innerHTML = "<p style='color: #fff; font-style: italic;'>Noch keine Wünsche da. Sei der Erste! 🎈</p>"
            return

        for index, wish in enumerate(wishes_list):
            new_div = document.createElement("div")
            new_div.className = "wish-item"
            
            # Text auslesen
            text = ""
            try:
                if hasattr(wish, "get"):
                    text = wish.get('text', '')
                elif isinstance(wish, dict):
                    text = wish.get('text', '')
                else:
                    text = str(wish)
            except:
                text = str(wish)
                
            text_span = document.createElement("span")
            text_span.innerText = f"🎂 {text}"
            new_div.appendChild(text_span)

            del_btn = document.createElement("button")
            del_btn.className = "delete-btn"
            del_btn.innerText = "Löschen"
            
            def make_delete_handler(idx):
                async def delete_handler(event):
                    try:
                        await js.apiDeleteWish(idx)
                        await load_wishes()
                    except Exception as e:
                        js.alert(f"Fehler beim Löschen: {e}")
                return delete_handler

            del_btn.onclick = lambda e, idx=index: asyncio.ensure_future(make_delete_handler(idx)(e))
            new_div.appendChild(del_btn)

            container.appendChild(new_div)
            
    except Exception as e:
        container.innerHTML = f"<p style='color: yellow;'>Fehler beim Laden: {e}</p>"

async def add_wish(event):
    input_box = document.getElementById("wishInput")
    if not input_box:
        return
    wish_text = input_box.value.strip()

    if wish_text:
        try:
            await js.apiSaveWish(wish_text)
            input_box.value = ""
            await load_wishes()
        except Exception as e:
            js.alert(f"Fehler beim Speichern: {e}")

async def setup():
    btn = document.getElementById("sendBtn")
    if btn:
        btn.onclick = lambda e: asyncio.ensure_future(add_wish(e))
    await load_wishes()

asyncio.ensure_future(setup())
    </script>

</body>
</html>
