<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geburtstagskarte zum 63. für Papa 🎂</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- INTRO VIDEO SCREEN --- */
        #introScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .video-wrapper {
            position: relative;
            width: 85vw;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #introVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Großer Start-Button der die Browser-Sperre umgeht */
        #startAudioBtn {
            position: absolute;
            background-color: #e80000;
            color: white;
            border: 3px solid #fff;
            padding: 20px 35px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(0,0,0,0.8);
            z-index: 10001;
            animation: pulseBtn 1.5s infinite;
        }

        #skipToIntroBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: #e80000;
            color: white;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none; 
            z-index: 10000;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* --- HAUPTKARTE --- */
        #mainCardContainer {
            display: none;
            width: 100%;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: rgb(232, 0, 0);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        h1, h2, h3, p { color: #000; }
        .cake-img {
            width: 100%;
            max-width: 500px;
            height: auto;
            margin: 15px 0;
            border-radius: 12px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 2px solid #000;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 10px;
        }
        button {
            background-color: #000;
            color: rgba(255, 0, 0, 0.9);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .wishes-container {
            margin-top: 20px;
            text-align: left;
            max-height: 220px;
            overflow-y: auto;
            border-top: 2px solid #fff;
            padding-top: 15px;
        }
        .wish-item {
            background: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #000;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-only {
            display: none !important;
        }
        .admin-del-btn {
            background: #d63031;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .admin-section {
            margin-top: 15px;
            border-top: 1px dashed #000;
            padding-top: 10px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 10px;
        }
        .header-container h1 {
            margin: 0;
            text-align: left;
            font-size: 24px;
        }
        .radio-buttons-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .radio-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #e80000;
            color: white;
            border: 2px solid #000;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .radio-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <!-- INTRO-BEREICH MIT VIDEO -->
    <div id="introScreen">
        <div class="video-wrapper">
            <!-- Der Button zum Starten mit Ton -->
            <button id="startAudioBtn" onclick="playVideoWithSound()">▶ Video mit Ton starten</button>
            <video id="introVideo" src="assets/video/intro.mp4" playsinline controls></video>
        </div>
        <button id="skipToIntroBtn" onclick="goToMainCard()">Zur Hauptkarte ➔</button>
    </div>

    <!-- HAUPTKARTE -->
    <div id="mainCardContainer">
        <div class="card">
            <div class="header-container">
                <h1>Alles Gute zum Geburtstag, Papa! 🎂</h1>
                <div class="radio-buttons-wrapper">
                    <button id="radio1Btn" class="radio-btn" onclick="toggleRadio('liga1')" title="1. Liga Konferenz an/aus">⚽1</button>
                    <button id="radio2Btn" class="radio-btn" onclick="toggleRadio('liga2')" title="2. Liga Konferenz an/aus">⚽2</button>
                </div>
            </div>

            <img src="assets/pics/birthdaycake/birthdaycake.jpg" alt="Geburtstagstorte" class="cake-img">
            <h2>Der Countdown läuft! Nur noch 4 Jahre bis zur Rente... Lass dich feiern und bleib gesund!</h2>

            <audio id="streamLiga1" src="https://dispatcher.rndfnk.com/wdr/sportschau/liga1konferenz/mp3/128/stream.mp3" preload="none"></audio>
            <audio id="streamLiga2" src="https://dispatcher.rndfnk.com/wdr/sportschau/liga2konferenz/mp3/128/stream.mp3" preload="none"></audio>

            <div>
                <textarea id="wishInput" placeholder="Deine Glückwünsche für Peter_Werner R. (Papa)"></textarea>
                <br>
                <button id="sendBtn">Glückwunsch abschicken</button>
            </div>

            <div class="wishes-container">
                <h3>Alle Glückwünsche:</h3>
                <div id="wishesContent">Lade Wünsche...</div>
            </div>

            <div class="admin-section">
                <button onclick="unlockAdmin()" style="background: transparent; color: #000; border: none; font-size: 11px; cursor: pointer; text-decoration: underline;">Admin-Modus</button>
                <button id="clearAllBtn" class="admin-only" onclick="clearAllWishes()" style="background: #2d3436; color: #ff7675; font-size: 11px; padding: 5px 8px;">🗑️ Alle löschen</button>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = "6aa640e9ffd5d16053008348";
        const API_KEY = "$2a$10$.s1t/9O62oQZZnpvpjzIhu81NrRa5Kn8kMoJFTMgj2dnBTPS.54da";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;
        
        let currentActiveAudio = null;
        let currentActiveBtn = null;

        const videoElement = document.getElementById('introVideo');
        const startBtn = document.getElementById('startAudioBtn');
        const skipBtn = document.getElementById('skipToIntroBtn');

        function playVideoWithSound() {
            startBtn.style.display = 'none'; // Button ausblenden
            videoElement.muted = false;     // Ton einschalten
            videoElement.play();            // Video abspielen
            skipBtn.style.display = 'block';// Überspringen-Button anzeigen
        }

        videoElement.addEventListener('ended', function() {
            skipBtn.style.display = 'block';
        });

        function goToMainCard() {
            videoElement.pause();
            document.getElementById('introScreen').style.display = 'none';
            document.getElementById('mainCardContainer').style.display = 'flex';
        }

        function toggleRadio(liga) {
            let audioId = liga === 'liga1' ? 'streamLiga1' : 'streamLiga2';
            let btnId = liga === 'liga1' ? 'radio1Btn' : 'radio2Btn';
            
            let audio = document.getElementById(audioId);
            let btn = document.getElementById(btnId);

            if (currentActiveAudio && currentActiveAudio !== audio) {
                currentActiveAudio.pause();
                currentActiveAudio.currentTime = 0;
                if (currentActiveBtn) currentActiveBtn.style.backgroundColor = "#e80000";
            }

            if (audio.paused) {
                audio.play().then(() => {
                    btn.style.backgroundColor = "#27ae60";
                    currentActiveAudio = audio;
                    currentActiveBtn = btn;
                }).catch(e => {
                    alert("Stream konnte nicht gestartet werden.");
                });
            } else {
                audio.pause();
                audio.currentTime = 0;
                btn.style.backgroundColor = "#e80000";
                currentActiveAudio = null;
                currentActiveBtn = null;
            }
        }

        function unlockAdmin() {
            let code = prompt("Bitte Admin-Zugangscode eingeben:");
            if (code === "C@R66289rc!?") {
                sessionStorage.setItem("isAdmin", "true");
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'inline-block');
                alert("Admin-Modus erfolgreich aktiviert!");
                location.reload();
            } else if (code !== null) {
                alert("Falscher Code!");
            }
        }

        function checkAdminStatus() {
            return sessionStorage.getItem("isAdmin") === "true";
        }

        async function fetchWishes() {
            try {
                let res = await fetch(`${API_URL}?t=${Date.now()}`, {
                    headers: { "X-Master-Key": API_KEY }
                });
                let data = await res.json();
                let rawList = data.record?.wishes || data.wishes || [];
                
                return rawList.map((item, index) => {
                    let text = typeof item === 'string' ? item : (item?.text || item?.wish || JSON.stringify(item));
                    return { text: text, index: index };
                });
            } catch (e) {
                console.error(e);
                return [];
            }
        }

        async function saveWishText(text) {
            let res = await fetch(API_URL, { headers: { "X-Master-Key": API_KEY } });
            let data = await res.json();
            let rawList = data.record?.wishes || data.wishes || [];
            
            let list = rawList.map(item => typeof item === 'string' ? { text: item } : item);
            list.unshift({ text: text });

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                body: JSON.stringify({ wishes: list })
            });
        }

        async function deleteSingleWish(indexToDelete) {
            if (!checkAdminStatus()) {
                alert("Keine Berechtigung!");
                return;
            }
            if (!confirm("Diesen Eintrag wirklich löschen?")) return;
            try {
                let res = await fetch(API_URL, { headers: { "X-Master-Key": API_KEY } });
                let data = await res.json();
                let rawList = data.record?.wishes || data.wishes || [];
                
                rawList.splice(indexToDelete, 1);

                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                    body: JSON.stringify({ wishes: rawList })
                });
                location.reload();
            } catch (e) {
                alert("Fehler beim Löschen: " + e);
            }
        }

        async function clearAllWishes() {
            if (!checkAdminStatus()) return;
            if (!confirm("ACHTUNG: WIRKLICH ALLE Nachrichten löschen?")) return;
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                    body: JSON.stringify({ wishes: [] })
                });
                alert("Datenbank geleert!");
                location.reload();
            } catch (e) {
                alert("Fehler: " + e);
            }
        }
    </script>

    <!-- Python Steuerung -->
    <script type="py">
from pyscript import document
import js
import asyncio

async def load_ui():
    container = document.getElementById("wishesContent")
    if not container:
        return
    try:
        wishes = await js.fetchWishes()
        container.innerHTML = ""
        is_admin = js.checkAdminStatus()
        
        if not wishes or len(wishes) == 0:
            container.innerHTML = "<p style='color: #000; font-style: italic;'>Noch keine Wünsche da. Sei der Erste! 🎈</p>"
            return

        for w in wishes:
            text = w.text
            idx = w.index
            
            div = document.createElement("div")
            div.className = "wish-item"
            
            span = document.createElement("span")
            span.innerText = f"🎂 {text}"
            div.appendChild(span)
            
            if is_admin:
                del_btn = document.createElement("button")
                del_btn.className = "admin-del-btn"
                del_btn.innerText = "X"
                del_btn.title = "Diesen Eintrag löschen"
                
                def make_del(i):
                    return lambda event: asyncio.ensure_future(js.deleteSingleWish(i))
                    
                del_btn.onclick = make_del(idx)
                div.appendChild(del_btn)
            
            container.appendChild(div)
            
        if is_admin:
            clear_btn = document.getElementById("clearAllBtn")
            if clear_btn:
                clear_btn.style.display = "inline-block"
                
    except Exception as e:
        container.innerHTML = f"Fehler: {e}"

async def handle_click(event):
    box = document.getElementById("wishInput")
    if not box:
        return
    val = box.value.strip()
    if val:
        await js.saveWishText(val)
        box.value = ""
        await load_ui()
        js.alert("Gespeichert! 🎉")

asyncio.ensure_future(init := lambda: None) # Dummy cleanup

async def init():
    btn = document.getElementById("sendBtn")
    if btn:
        btn.onclick = lambda e: asyncio.ensure_future(handle_click(e))
    await load_ui()

asyncio.ensure_future(init())
    </script>

</body>
</html>
