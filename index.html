<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geburtstagskarte zum 63. für Papa 🎂</title>
    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #000000 100%);
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: rgb(232, 0, 0);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.313);
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #000000;
            margin-bottom: 5px;
        }
        .cake-img {
            width: 100%;
            max-width: 500px;
            height: auto;
            margin: 15px 0;
            border-radius: 12px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 2px solid #000000;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 10px;
        }
        button {
            background-color: #000000;
            color: rgba(255, 0, 0, 0.735);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #74b9ff;
        }
        .wishes-container {
            margin-top: 20px;
            text-align: left;
            max-height: 220px;
            overflow-y: auto;
            border-top: 2px solid #f1f1f1;
            padding-top: 15px;
        }
        .wish-item {
            background: #dfe6e9;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Alles Gute zum Geburtstag, Papa! 🎂</h1>
        <p>Trage hier deine Wünsche ein, damit er sie sehen kann!</p>
        
        <!-- Torten-Bild -->
        <img src="assets/pics/birthdaycake/birthdaycake.jpg" alt="Geburtstagstorte" class="cake-img">

        <h2>Der Countdown läuft!!!, Nur noch 4 Jahre bis zur Wohlverdienten Rente... Alles, alles gute zum Geburtstag!!!, lass dich feiern und bleib Gesund!!!</h2>

        <div>
            <textarea id="wishInput" placeholder="Dein Glückwunsch für Papa..."></textarea>
            <br>
            <button id="sendBtn">Glückwunsch abschicken</button>
        </div>

        <div class="wishes-container">
            <h3>Alle Glückwünsche:</h3>
            <div id="wishesContent">Lade Wünsche...</div>
        </div>
    </div>

    <!-- Echte Python-Logik mit PyScript -->
    <script type="py">
from pyscript import document
import js
import asyncio
import json

API_URL = "https://api.npoint.io/ea85f79b1d069540e752"

async def load_wishes():
    container = document.getElementById("wishesContent")
    if not container:
        return
    try:
        response = await js.window.fetch(API_URL)
        text_data = await response.text()
        
        try:
            data_py = json.loads(text_data)
        except:
            data_py = {}
            
        wishes_list = data_py.get("wishes", []) if isinstance(data_py, dict) else []
        
        container.innerHTML = ""
        if not wishes_list:
            container.innerHTML = "<p style='color: #fff; font-style: italic;'>Noch keine Wünsche da. Sei der Erste! 🎈</p>"
            return

        for wish in wishes_list:
            new_div = document.createElement("div")
            new_div.className = "wish-item"
            text = wish.get('text', '') if isinstance(wish, dict) else str(wish)
            new_div.innerText = f"🎂 {text}"
            container.appendChild(new_div)
            
    except Exception as e:
        container.innerHTML = f"<p style='color: yellow;'>Fehler beim Laden: {e}</p>"

async def add_wish(event):
    input_box = document.getElementById("wishInput")
    if not input_box:
        return
    wish_text = input_box.value.strip()

    if wish_text:
        try:
            # 1. Bestehende Daten abrufen
            response = await js.window.fetch(API_URL)
            text_data = await response.text()
            try:
                data_py = json.loads(text_data)
            except:
                data_py = {}
            
            wishes_list = data_py.get("wishes", []) if isinstance(data_py, dict) else []
            if not isinstance(wishes_list, list):
                wishes_list = []
            
            # 2. Neuen Wunsch in Python einfügen
            wishes_list.insert(0, {"text": wish_text})
            payload = json.dumps({"wishes": wishes_list})
            
            # 3. Über PUT an npoint senden
            opts = {
                "method": "PUT",
                "headers": {"Content-Type": "application/json; charset=UTF-8"},
                "body": payload
            }
            
            await js.window.fetch(API_URL, opts)
            
            js.alert("Glückwunsch erfolgreich gespeichert! 🎉")
            input_box.value = ""
            await load_wishes()
            
        except Exception as e:
            js.alert(f"Fehler beim Speichern: {e}")

async def setup():
    btn = document.getElementById("sendBtn")
    if btn:
        btn.onclick = lambda e: asyncio.ensure_future(add_wish(e))
    await load_wishes()

asyncio.ensure_future(setup())
    </script>

</body>
</html>
