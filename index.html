<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geburtstagskarte zum 63. für Papa 🎂</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: rgb(232, 0, 0);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        h1, h2, h3, p { color: #000; }
        .cake-img {
            width: 100%;
            max-width: 500px;
            height: auto;
            margin: 15px 0;
            border-radius: 12px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 2px solid #000;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 10px;
        }
        button {
            background-color: #000;
            color: rgba(255, 0, 0, 0.9);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .wishes-container {
            margin-top: 20px;
            text-align: left;
            max-height: 220px;
            overflow-y: auto;
            border-top: 2px solid #fff;
            padding-top: 15px;
        }
        .wish-item {
            background: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Alles Gute zum Geburtstag, Papa! 🎂</h1>
        <img src="assets/pics/birthdaycake/birthdaycake.jpg" alt="Geburtstagstorte" class="cake-img">
        <h2>Der Countdown läuft! Nur noch 4 Jahre bis zur Rente... Lass dich feiern und bleib gesund!</h2>

        <div>
            <textarea id="wishInput" placeholder="Dein Glückwunsch für Papa..."></textarea>
            <br>
            <button id="sendBtn">Glückwunsch abschicken</button>
        </div>

        <div class="wishes-container">
            <h3>Alle Glückwünsche:</h3>
            <div id="wishesContent">Lade Wünsche...</div>
        </div>
    </div>

    <!-- JavaScript Direkt-API (Garantierte Text-Ausgabe) -->
    <script>
        const BIN_ID = "6aa640e9ffd5d16053008348";
        const API_KEY = "$2a$10$.s1t/9O62oQZZnpvpjzIhu81NrRa5Kn8kMoJFTMgj2dnBTPS.54da";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

        async function fetchWishesText() {
            try {
                let res = await fetch(`${API_URL}?t=${Date.now()}`, {
                    headers: { "X-Master-Key": API_KEY }
                });
                let data = await res.json();
                let rawList = data.record?.wishes || data.wishes || [];
                
                // Mappe alles brutal hart in einfache Strings, damit niemals [object Object] entsteht
                return rawList.map(item => {
                    if (typeof item === 'string') return item;
                    if (item && typeof item === 'object') return item.text || item.wish || JSON.stringify(item);
                    return String(item);
                });
            } catch (e) {
                console.error(e);
                return [];
            }
        }

        async function saveWishText(text) {
            let res = await fetch(API_URL, {
                headers: { "X-Master-Key": API_KEY }
            });
            let data = await res.json();
            let rawList = data.record?.wishes || data.wishes || [];
            
            // Konvertiere zu Strings für die Sicherheit
            let list = rawList.map(item => (typeof item === 'object' && item !== null) ? (item.text || '') : String(item));
            
            // Neuen Text vorne anfügen (als reines Objekt, aber beim Lesen sauber extrahiert)
            list.unshift({ text: text });

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": API_KEY
                },
                body: JSON.stringify({ wishes: list })
            });
        }
    </script>

    <!-- Python Steuerung -->
    <script type="py">
from pyscript import document
import js
import asyncio

async def load_ui():
    container = document.getElementById("wishesContent")
    if not container:
        return
    try:
        texts = await js.fetchWishesText()
        container.innerHTML = ""
        
        if not texts or len(texts) == 0:
            container.innerHTML = "<p style='color: #000; font-style: italic;'>Noch keine Wünsche da. Sei der Erste! 🎈</p>"
            return

        for t in texts:
            div = document.createElement("div")
            div.className = "wish-item"
            div.innerText = f"🎂 {str(t)}"
            container.appendChild(div)
    except Exception as e:
        container.innerHTML = f"Fehler: {e}"

async def handle_click(event):
    box = document.getElementById("wishInput")
    if not box:
        return
    val = box.value.strip()
    if val:
        await js.saveWishText(val)
        box.value = ""
        await load_ui()
        js.alert("Gespeichert! 🎉")

async def init():
    btn = document.getElementById("sendBtn")
    if btn:
        btn.onclick = lambda e: asyncio.ensure_future(handle_click(e))
    await load_ui()

asyncio.ensure_future(init())
    </script>

</body>
</html>
